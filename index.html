
<!DOCTYPE html>
<html lang="en">
    
<style>
    body {
        background-color: #101827;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
    }

    #dashboard {
        background-color: #243247;
        border: 2px solid #3b82f6;
        border-radius: 12px;
        padding: 30px;
        margin: 20px auto;
        max-width: 500px;
    }

    #warning {
        color: #4ade80;
        font-size: 28px;
    }

    #risk {
        font-size: 22px;
    }

    #status {
        color: #cbd5e1;
    }

    #environment {
        background-color: #243247;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
        margin: 20px auto;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Driver Warning System</title>
</head>

<body>

    <h1>Adaptive Driver Warning System</h1>

    <p>This simulator explores the impact of false collision
    warnings on driver trust and responsiveness.</p>

    <h2>Vehicle Dashboard</h2>

    <div id="dashboard">
        <h3 id="warning">System Ready</h3>
        <p id="risk">Risk Score: 0%</p>
        <p id="status">Status: Monitoring Road</p>
    </div>

    <h2>Driving Environment</h2>

    <p id="environment">No scenario selected.</p>
    <h2>Select Driving Scenario</h2>

<button onclick="selectScenario('safe')">
    Clear Road
</button>

<button onclick="selectScenario('traffic')">
    Slow Traffic
</button>

<button onclick="selectScenario('hazard')">
    Sudden Braking
</button>

<script>
    function selectScenario(scenario) {
        let description;

        if (scenario === "safe") {
            description = "The road ahead is clear.";
        }
        else if (scenario === "traffic") {
            description = "A slower vehicle is travelling ahead.";
        }
        else if (scenario === "hazard") {
            description = "The vehicle ahead has suddenly braked.";
        }

        document.getElementById("environment").textContent =
            description;
    }

<script>
    function selectScenario(scenario) {
        let description;
        let risk;

        if (scenario === "safe") {
            description = "The road ahead is clear.";
            risk = 10;
        }
        else if (scenario === "traffic") {
            description = "A slower vehicle is travelling ahead.";
            risk = 45;
        }
        else if (scenario === "hazard") {
            description = "The vehicle ahead has suddenly braked.";
            risk = 90;
        }

        document.getElementById("environment").textContent =
            description;

        document.getElementById("risk").textContent =
            "Risk Score: " + risk + "%";
    }
</script>



</body>
</html>
